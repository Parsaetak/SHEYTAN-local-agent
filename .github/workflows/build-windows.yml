name: build-windows

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "1.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SHEYTAN Local Agent — Windows
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend format check
        run: npm run format:check

      - name: Build frontend and synchronize embedded assets
        run: npm run build

      - name: Verify embedded frontend
        run: |
          test -f web/static/index.html
          test -d web/static/assets
          echo "Embedded frontend assets verified."

      - name: Regenerate Windows resources
        run: go run ./scripts/gen-syso

      - name: Run internal unit tests
        run: go test ./internal/... -tags headless

      - name: Run full Go test suite
        run: go test ./... -run Test -count=1

      - name: Vet
        run: go vet ./...

      - name: Build Windows executable
        run: |
          mkdir -p dist
          go build \
            -buildvcs=false \
            -ldflags="-s -w -H=windowsgui" \
            -o dist/sheytan-local-agent.exe .

      - name: Verify executable
        run: |
          test -f dist/sheytan-local-agent.exe
          test -s dist/sheytan-local-agent.exe
          echo "Windows executable created successfully."

      - name: Verify signature metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          data = Path("dist/sheytan-local-agent.exe").read_bytes()
          probe = "Parsa Tak".encode("utf-16-le")

          if probe not in data:
              raise SystemExit(
                  "signature metadata (Parsa Tak) missing from executable"
              )

          print("signature metadata verified: Parsa Tak")
          PY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: sheytan-local-agent-windows
          path: dist/sheytan-local-agent.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sheytan-local-agent.exe
          fail_on_unmatched_files: true
