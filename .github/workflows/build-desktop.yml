name: Build Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  APP_VERSION: "1.1.0"
  APP_CODENAME: "Zeta"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Node and repository
        shell: pwsh
        run: |
          node --version
          npm --version

          $nodeMajor = [int](node --version).TrimStart("v").Split(".")[0]

          if ($nodeMajor -lt 22) {
            throw "Node.js 22 or newer is required."
          }

          if (-not (Test-Path "package.json")) {
            throw "Root package.json was not found."
          }

          if (Test-Path "web/package.json") {
            throw "Unexpected web/package.json found. Frontend package is expected at repository root."
          }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Frontend typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Frontend lint
        shell: pwsh
        run: npm run lint

      - name: Build frontend
        shell: pwsh
        run: npm run build

      - name: Verify generated frontend
        shell: pwsh
        run: |
          if (-not (Test-Path "web/static/index.html")) {
            throw "web/static/index.html was not generated."
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go
        shell: pwsh
        run: |
          go version
          go env GOOS
          go env GOARCH

      - name: Go tests
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1

      - name: Go vet
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build Windows executable
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows/app/SHEYTAN-Local-Agent" | Out-Null

          go build `
            -trimpath `
            -ldflags="-s -w" `
            -o "dist/windows/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe" `
            .

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = "dist/windows/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not produced."
          }

          $size = (Get-Item $exe).Length

          if ($size -lt 1000000) {
            throw "Windows executable is suspiciously small: $size bytes."
          }

          Write-Host "Windows executable size: $size bytes"

          & $exe version

          if ($LASTEXITCODE -ne 0) {
            throw "Windows executable version smoke test failed."
          }

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          $root = "dist/windows/app/SHEYTAN-Local-Agent"

          New-Item -ItemType Directory -Force -Path "$root/models" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/workspace" | Out-Null

          @"
          SHEYTAN-Local-Agent $env:APP_VERSION ($env:APP_CODENAME)

          Portable Windows x64 distribution.

          Keep the complete SHEYTAN-Local-Agent folder together.

          Models, sessions, runtime data, logs, and Coding Lab workspaces
          are intended to remain associated with this portable folder.
          "@ | Set-Content "$root/README.txt" -Encoding utf8

          @"
          LOCAL MODELS

          Place GGUF models in this folder.

          The application can discover local models and lets the user
          select the active model directly from the Agent or Settings UI.
          "@ | Set-Content "$root/models/README.txt" -Encoding utf8

          @"
          CODING LAB

          Coding Lab workspaces can be stored in this folder.

          Keep the application folder together when moving the portable package.
          "@ | Set-Content "$root/workspace/README.txt" -Encoding utf8

          @"
          SHEYTAN-Local-Agent
          Version: $env:APP_VERSION
          Codename: $env:APP_CODENAME
          Platform: Windows x64
          "@ | Set-Content "$root/BUILD-INFO.txt" -Encoding utf8

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$root/LICENSE" -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" "$root/README.md" -Force
          }

          if (Test-Path "agent.md") {
            Copy-Item "agent.md" "$root/AI-CONTEXT.md" -Force
          }

          if (Test-Path "SIGNATURE") {
            Copy-Item "SIGNATURE" "$root/SIGNATURE" -Force
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $zip = "dist/SHEYTAN-Local-Agent-Windows-x64-v${env:APP_VERSION}Z.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist/windows/app/SHEYTAN-Local-Agent" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created."
          }

      - name: Verify Windows ZIP
        shell: pwsh
        run: |
          $zip = "dist/SHEYTAN-Local-Agent-Windows-x64-v${env:APP_VERSION}Z.zip"

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP is missing."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))

          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })

            $requiredEntries = @(
              "SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe"
            )

            foreach ($required in $requiredEntries) {
              if (-not ($entries -contains $required)) {
                throw "Missing required ZIP entry: $required"
              }
            }

            if (-not ($entries | Where-Object {
              $_ -like "SHEYTAN-Local-Agent/models/*"
            })) {
              throw "ZIP is missing models directory."
            }

            if (-not ($entries | Where-Object {
              $_ -like "SHEYTAN-Local-Agent/workspace/*"
            })) {
              throw "ZIP is missing workspace directory."
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z
          path: dist/SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z.zip
          fail_on_unmatched_files: true

  build-linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            zip

      - name: Verify Node and repository
        shell: bash
        run: |
          node --version
          npm --version

          node_major="$(node -p 'process.versions.node.split(".")[0]')"

          if [ "$node_major" -lt 22 ]; then
            echo "Node.js 22 or newer is required."
            exit 1
          fi

          test -f package.json

          if [ -f web/package.json ]; then
            echo "Unexpected web/package.json found."
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Verify generated frontend
        run: |
          test -f web/static/index.html

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Go
        run: |
          go version
          go env GOOS
          go env GOARCH

      - name: Go tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1

      - name: Go vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Build Linux executable
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "dist/linux/app/SHEYTAN-Local-Agent"

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent" \
            .

      - name: Verify Linux executable
        run: |
          exe="dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent"

          test -f "$exe"
          test -x "$exe"

          file "$exe"

          size="$(stat -c '%s' "$exe")"

          if [ "$size" -lt 1000000 ]; then
            echo "Linux executable is suspiciously small: $size bytes"
            exit 1
          fi

          echo "Linux executable size: $size bytes"

          "$exe" version

      - name: Prepare Linux portable package
        run: |
          root="dist/linux/app/SHEYTAN-Local-Agent"

          mkdir -p "$root/models"
          mkdir -p "$root/workspace"

          cat > "$root/README.txt" <<EOF
          SHEYTAN-Local-Agent ${APP_VERSION} (${APP_CODENAME})

          Portable Linux x64 distribution.

          Keep the complete SHEYTAN-Local-Agent folder together.

          Models, sessions, runtime data, logs, and Coding Lab workspaces
          are intended to remain associated with this portable folder.
          EOF

          cat > "$root/models/README.txt" <<EOF
          LOCAL MODELS

          Place GGUF models in this folder.

          The application can discover local models and lets the user
          select the active model directly from the Agent or Settings UI.
          EOF

          cat > "$root/workspace/README.txt" <<EOF
          CODING LAB

          Coding Lab workspaces can be stored in this folder.

          Keep the application folder together when moving the portable package.
          EOF

          cat > "$root/BUILD-INFO.txt" <<EOF
          SHEYTAN-Local-Agent
          Version: ${APP_VERSION}
          Codename: ${APP_CODENAME}
          Platform: Linux x64
          EOF

          if [ -f LICENSE ]; then
            cp LICENSE "$root/LICENSE"
          fi

          if [ -f README.md ]; then
            cp README.md "$root/README.md"
          fi

          if [ -f agent.md ]; then
            cp agent.md "$root/AI-CONTEXT.md"
          fi

          if [ -f SIGNATURE ]; then
            cp SIGNATURE "$root/SIGNATURE"
          fi

      - name: Create Linux ZIP
        run: |
          mkdir -p dist

          cd dist/linux/app

          zip -r \
            "../../SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip" \
            "SHEYTAN-Local-Agent"

      - name: Verify Linux ZIP
        run: |
          zip="dist/SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip"

          test -f "$zip"

          unzip -t "$zip"

          unzip -Z1 "$zip" | grep -q \
            '^SHEYTAN-Local-Agent/SHEYTAN-Local-Agent$'

          unzip -Z1 "$zip" | grep -q \
            '^SHEYTAN-Local-Agent/models/'

          unzip -Z1 "$zip" | grep -q \
            '^SHEYTAN-Local-Agent/workspace/'

      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z
          path: dist/SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish Linux ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z.zip
          fail_on_unmatched_files: true
