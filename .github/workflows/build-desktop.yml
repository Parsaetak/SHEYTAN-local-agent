name: build-desktop

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "1.*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build SHEYTAN Local Agent — Windows
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend format
        run: |
          npm run format
          npm run format:check

      - name: Build frontend and synchronize embedded assets
        run: npm run build

      - name: Verify embedded frontend
        run: |
          test -f web/static/index.html
          test -d web/static/assets
          grep -q 'type="module"' web/static/index.html
          echo "Embedded Node/Vite frontend verified."

      - name: Regenerate Windows resources
        run: go run ./scripts/gen-syso

      - name: Run internal unit tests
        run: go test ./internal/... -tags headless

      - name: Run full Go test suite
        run: go test ./... -run Test -count=1

      - name: Vet
        run: go vet ./...

      - name: Build Windows executable
        run: |
          mkdir -p dist/windows

          go build \
            -buildvcs=false \
            -ldflags="-s -w -H=windowsgui" \
            -o dist/windows/sheytan-local-agent-windows-amd64.exe .

      - name: Verify Windows executable format
        run: |
          test -f dist/windows/sheytan-local-agent-windows-amd64.exe
          test -s dist/windows/sheytan-local-agent-windows-amd64.exe

          python - <<'PY'
          from pathlib import Path

          path = Path("dist/windows/sheytan-local-agent-windows-amd64.exe")
          data = path.read_bytes()

          if data[:2] != b"MZ":
              raise SystemExit("invalid Windows executable: missing MZ header")

          pe_offset = int.from_bytes(data[0x3C:0x40], "little")

          if data[pe_offset:pe_offset + 4] != b"PE\x00\x00":
              raise SystemExit("invalid Windows executable: missing PE signature")

          print(f"Valid PE executable: {path}")
          print(f"Size: {path.stat().st_size} bytes")
          PY

      - name: Verify Windows signature metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          executable = Path(
              "dist/windows/sheytan-local-agent-windows-amd64.exe"
          )

          data = executable.read_bytes()
          probe = "Parsa Tak".encode("utf-16-le")

          if probe not in data:
              raise SystemExit(
                  "signature metadata (Parsa Tak) missing from Windows executable"
              )

          print("Windows signature metadata verified: Parsa Tak")
          PY

      - name: Smoke-test Windows executable
        run: |
          ./dist/windows/sheytan-local-agent-windows-amd64.exe version
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "Windows executable smoke test failed with exit code $status"
            exit "$status"
          fi

          echo "Windows executable smoke test passed."

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v5
        with:
          name: sheytan-local-agent-windows-amd64
          path: dist/windows/sheytan-local-agent-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

      - name: Attach Windows executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SHEYTAN Local Agent ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/windows/sheytan-local-agent-windows-amd64.exe

  build-linux:
    name: Build SHEYTAN Local Agent — Linux
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend format
        run: |
          npm run format
          npm run format:check

      - name: Build frontend and synchronize embedded assets
        run: npm run build

      - name: Verify embedded frontend
        run: |
          test -f web/static/index.html
          test -d web/static/assets
          grep -q 'type="module"' web/static/index.html
          echo "Embedded Node/Vite frontend verified."

      - name: Run Go tests
        run: go test ./... -run Test -count=1

      - name: Vet
        run: go vet ./...

      - name: Build Linux executable
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/linux

          go build \
            -buildvcs=false \
            -ldflags="-s -w" \
            -o dist/linux/sheytan-local-agent-linux-amd64 .

      - name: Verify Linux executable
        run: |
          test -f dist/linux/sheytan-local-agent-linux-amd64
          test -s dist/linux/sheytan-local-agent-linux-amd64

          chmod +x dist/linux/sheytan-local-agent-linux-amd64

          file dist/linux/sheytan-local-agent-linux-amd64

          python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/linux/sheytan-local-agent-linux-amd64")
          data = path.read_bytes()

          if data[:4] != b"\x7fELF":
              raise SystemExit("invalid Linux executable: missing ELF header")

          print(f"Valid ELF executable: {path}")
          print(f"Size: {path.stat().st_size} bytes")
          PY

      - name: Smoke-test Linux executable
        run: |
          ./dist/linux/sheytan-local-agent-linux-amd64 version
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "Linux executable smoke test failed with exit code $status"
            exit "$status"
          fi

          echo "Linux executable smoke test passed."

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v5
        with:
          name: sheytan-local-agent-linux-amd64
          path: dist/linux/sheytan-local-agent-linux-amd64
          if-no-files-found: error
          retention-days: 14

      - name: Attach Linux executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SHEYTAN Local Agent ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: dist/linux/sheytan-local-agent-linux-amd64
