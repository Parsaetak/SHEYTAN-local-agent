name: Build Desktop

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  APP_VERSION: "1.1.0"
  APP_CODENAME: "Zeta"

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        shell: pwsh
        run: npm install

      - name: Frontend typecheck
        working-directory: web
        shell: pwsh
        run: npm run typecheck

      - name: Frontend lint
        working-directory: web
        shell: pwsh
        run: npm run lint

      - name: Frontend format check
        working-directory: web
        shell: pwsh
        run: npm run format:check

      - name: Build frontend
        working-directory: web
        shell: pwsh
        run: npm run build

      - name: Verify embedded frontend
        shell: pwsh
        run: |
          if (-not (Test-Path "web/static/index.html")) {
            throw "web/static/index.html was not generated."
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go tests
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1

      - name: Go vet
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Build Windows executable
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows/app/SHEYTAN-Local-Agent" | Out-Null

          go build `
            -trimpath `
            -ldflags="-s -w -X main.version=${env:APP_VERSION} -X main.codename=${env:APP_CODENAME}" `
            -o "dist/windows/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe" `
            .

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $exe = "dist/windows/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not produced."
          }

          $size = (Get-Item $exe).Length
          if ($size -lt 1000000) {
            throw "Windows executable is suspiciously small: $size bytes."
          }

          & $exe version
          if ($LASTEXITCODE -ne 0) {
            throw "Windows version smoke test failed."
          }

      - name: Prepare Windows portable package
        shell: pwsh
        run: |
          $root = "dist/windows/app/SHEYTAN-Local-Agent"

          @"
          SHEYTAN-Local-Agent $env:APP_VERSION ($env:APP_CODENAME)

          Portable Windows distribution.

          Keep this entire SHEYTAN-Local-Agent folder together.
          Runtime data, models, sessions, logs, and workspaces stay beside the executable.
          "@ | Set-Content "$root/README.txt" -Encoding utf8

          @"
          Place GGUF models in this folder.

          The application scans the configured models directory and lets you
          select the active local model directly from the Agent and Settings UI.
          "@ | Set-Content "$root/models/README.txt" -Encoding utf8

          @"
          Coding Lab workspaces are created here.

          Keep this folder with the application when moving the portable package.
          "@ | Set-Content "$root/workspace/README.txt" -Encoding utf8

          @"
          SHEYTAN-Local-Agent
          Version: $env:APP_VERSION
          Codename: $env:APP_CODENAME
          Platform: Windows x64
          "@ | Set-Content "$root/BUILD-INFO.txt" -Encoding utf8

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "$root/LICENSE"
          }

          if (Test-Path "agent.md") {
            Copy-Item "agent.md" "$root/AI-CONTEXT.md"
          }

      - name: Create Windows ZIP
        shell: pwsh
        run: |
          $zip = "dist/SHEYTAN-Local-Agent-Windows-x64-v${env:APP_VERSION}Z.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "dist/windows/app/SHEYTAN-Local-Agent" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          if (-not (Test-Path $zip)) {
            throw "Windows ZIP was not created."
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z
          path: dist/SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHEYTAN-Local-Agent-Windows-x64-v${{ env.APP_VERSION }}Z.zip
          fail_on_unmatched_files: true

  build-linux:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            zip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Frontend typecheck
        working-directory: web
        run: npm run typecheck

      - name: Frontend lint
        working-directory: web
        run: npm run lint

      - name: Frontend format check
        working-directory: web
        run: npm run format:check

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Verify embedded frontend
        run: |
          test -f web/static/index.html

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Go tests
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./internal/... -tags headless -count=1
          go test ./... -run Test -count=1

      - name: Go vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Build Linux executable
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p "dist/linux/app/SHEYTAN-Local-Agent"

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${APP_VERSION} -X main.codename=${APP_CODENAME}" \
            -o "dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent" \
            .

      - name: Verify Linux executable
        run: |
          file "dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent"
          test -x "dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent"

          size="$(stat -c '%s' "dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent")"
          if [ "$size" -lt 1000000 ]; then
            echo "Linux executable is suspiciously small: $size bytes"
            exit 1
          fi

          "./dist/linux/app/SHEYTAN-Local-Agent/SHEYTAN-Local-Agent" version

      - name: Prepare Linux portable package
        run: |
          root="dist/linux/app/SHEYTAN-Local-Agent"

          cat > "$root/README.txt" <<EOF
          SHEYTAN-Local-Agent ${APP_VERSION} (${APP_CODENAME})

          Portable Linux distribution.

          Keep this entire SHEYTAN-Local-Agent folder together.
          Runtime data, models, sessions, logs, and workspaces stay beside the executable.
          EOF

          mkdir -p "$root/models" "$root/workspace"

          cat > "$root/models/README.txt" <<EOF
          Place GGUF models in this folder.

          The application scans the configured models directory and lets you
          select the active local model directly from the Agent and Settings UI.
          EOF

          cat > "$root/workspace/README.txt" <<EOF
          Coding Lab workspaces are created here.

          Keep this folder with the application when moving the portable package.
          EOF

          cat > "$root/BUILD-INFO.txt" <<EOF
          SHEYTAN-Local-Agent
          Version: ${APP_VERSION}
          Codename: ${APP_CODENAME}
          Platform: Linux x64
          EOF

          if [ -f LICENSE ]; then
            cp LICENSE "$root/LICENSE"
          fi

          if [ -f agent.md ]; then
            cp agent.md "$root/AI-CONTEXT.md"
          fi

      - name: Create Linux ZIP
        run: |
          mkdir -p dist
          cd dist/linux/app
          zip -r "../../SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip" "SHEYTAN-Local-Agent"

          test -f "../../SHEYTAN-Local-Agent-Linux-x64-v${APP_VERSION}Z.zip"

      - name: Upload Linux ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z
          path: dist/SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Linux ZIP to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHEYTAN-Local-Agent-Linux-x64-v${{ env.APP_VERSION }}Z.zip
          fail_on_unmatched_files: true
