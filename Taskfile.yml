version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

vars:
  APP_NAME: "SHEYTAN-Local-Agent"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"

tasks:
  build:
    summary: Build the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Package a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Run the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Run the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  frontend:install:
    summary: Install frontend dependencies
    cmds:
      - task: common:install:frontend:deps

  frontend:dev:
    summary: Start the frontend development server
    cmds:
      - task: common:dev:frontend

  frontend:build:
    summary: Build the production frontend
    cmds:
      - task: common:build:frontend

  frontend:typecheck:
    summary: Type-check the frontend
    cmds:
      - task: common:typecheck:frontend

  frontend:lint:
    summary: Lint the frontend
    cmds:
      - task: common:lint:frontend

  frontend:format:
    summary: Format the frontend
    cmds:
      - task: common:format:frontend

  frontend:format-check:
    summary: Verify frontend formatting
    cmds:
      - task: common:format-check:frontend
