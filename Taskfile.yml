version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/Taskfile.windows.yml
  linux: ./build/Taskfile.linux.yml
  darwin: ./build/Taskfile.darwin.yml

vars:
  APP_NAME: "SHEYTAN-Local-Agent"
  BIN_DIR: "bin"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"

tasks:
  build:
    desc: Build the application for the current platform
    cmds:
      - task: "{{OS}}:build"

  package:
    desc: Package the application for the current platform
    cmds:
      - task: "{{OS}}:package"

  run:
    desc: Run the application for the current platform
    cmds:
      - task: "{{OS}}:run"

  dev:
    desc: Run the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  frontend:install:
    desc: Install frontend dependencies
    cmds:
      - task: common:install:frontend:deps

  frontend:dev:
    desc: Start the frontend development server
    cmds:
      - task: common:dev:frontend

  frontend:build:
    desc: Build the production frontend
    cmds:
      - task: common:build:frontend

  frontend:typecheck:
    desc: Type-check the frontend
    cmds:
      - task: common:typecheck:frontend

  frontend:lint:
    desc: Lint the frontend
    cmds:
      - task: common:lint:frontend

  frontend:format:
    desc: Format the frontend
    cmds:
      - task: common:format:frontend

  frontend:format-check:
    desc: Verify frontend formatting
    cmds:
      - task: common:format-check:frontend
