version: "3"

vars:
  APP_NAME: "SHEYTAN-Local-Agent"
  BIN_DIR: "bin"
  OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}.exe"

tasks:
  build:
    desc: Build the Windows native executable
    deps:
      - common:build:frontend
    cmds:
      - mkdir "{{.BIN_DIR}}" 2>NUL || exit 0
      - go build -buildvcs=false -ldflags="-H windowsgui" -o "{{.OUTPUT}}" .

  package:
    desc: Build the Windows production executable
    deps:
      - build
    cmds:
      - echo Windows package created at "{{.OUTPUT}}"

  run:
    desc: Run the Windows native executable
    deps:
      - build
    cmds:
      - '"{{.OUTPUT}}"'
