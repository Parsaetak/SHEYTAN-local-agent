version: "3"

tasks:
  install:frontend:deps:
    desc: Install frontend dependencies
    dir: .
    cmds:
      - npm install

  dev:frontend:
    desc: Start the Vite development server for Wails
    dir: .
    cmds:
      - npm run dev -- --host 127.0.0.1 --port {{.VITE_PORT}}

  build:frontend:
    desc: Build and synchronize the React frontend
    dir: .
    deps:
      - install:frontend:deps
    cmds:
      - npm run build

  typecheck:frontend:
    desc: Type-check the React frontend
    dir: .
    deps:
      - install:frontend:deps
    cmds:
      - npm run typecheck

  lint:frontend:
    desc: Lint the React frontend
    dir: .
    deps:
      - install:frontend:deps
    cmds:
      - npm run lint

  format:frontend:
    desc: Format the React frontend
    dir: .
    deps:
      - install:frontend:deps
    cmds:
      - npm run format

  format-check:frontend:
    desc: Verify frontend formatting
    dir: .
    deps:
      - install:frontend:deps
    cmds:
      - npm run format:check

  frontend:build:
    desc: Compatibility alias for the React frontend build
    cmds:
      - task: build:frontend

  frontend:install:
    desc: Compatibility alias for frontend dependency installation
    cmds:
      - task: install:frontend:deps

  frontend:dev:
    desc: Compatibility alias for the React development server
    cmds:
      - task: dev:frontend

  frontend:typecheck:
    desc: Compatibility alias for frontend type-checking
    cmds:
      - task: typecheck:frontend

  frontend:lint:
    desc: Compatibility alias for frontend linting
    cmds:
      - task: lint:frontend

  frontend:format:
    desc: Compatibility alias for frontend formatting
    cmds:
      - task: format:frontend

  frontend:format-check:
    desc: Compatibility alias for frontend formatting checks
    cmds:
      - task: format-check:frontend
